<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gomoku Online</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section id="gamePanel" class="panel game-panel">
        <div class="panel-content">
          <div class="panel-header">
            <div class="panel-window-controls">
              <button
                id="minimizeGamePanelBtn"
                class="panel-minimize"
                type="button"
                aria-label="Minimize left panel"
                title="Minimize left panel"
              >
                <span aria-hidden="true"></span>
              </button>
            </div>
            <h1>Gomoku Online</h1>
          </div>
          <div class="panel-body">
            <p class="sub">Play with a friend using a room code, with voice call and video call option.</p>

            <div class="room-actions">
              <button id="createRoomBtn">Create Room</button>
              <div class="join-row">
                <input id="roomCodeInput" maxlength="8" placeholder="ROOM CODE" />
                <button id="joinRoomBtn" class="secondary">Join Room</button>
              </div>
            </div>

            <div class="status-row">
              <span>Room:</span>
              <strong id="roomCodeLabel">-</strong>
            </div>
            <div class="status-row">
              <span>You are:</span>
              <strong id="youAreLabel">-</strong>
            </div>
            <div class="status-row">
              <span>Game:</span>
              <strong id="gameStatusLabel">Create or join a room</strong>
            </div>

            <p id="message" class="message"></p>
          </div>
        </div>
      </section>

      <section class="board-wrap">
        <div class="board-toolbar" aria-label="Game controls">
          <button id="undoBtn" class="icon-control" type="button" aria-label="Undo" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 7L4 12L9 17" />
              <path d="M5 12H12C16.418 12 20 15.582 20 20" />
            </svg>
          </button>
          <button id="redoBtn" class="icon-control" type="button" aria-label="Redo" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 7L20 12L15 17" />
              <path d="M19 12H12C7.582 12 4 15.582 4 20" />
            </svg>
          </button>
          <button id="resetBtn" class="icon-control" type="button" aria-label="Reset Game" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 6V11H15" />
              <path d="M20 11C18.613 7.987 15.68 6 12.5 6C7.806 6 4 9.806 4 14.5S7.806 23 12.5 23C16.102 23 19.181 20.759 20.5 17.6" />
            </svg>
          </button>
        </div>
        <div id="board" class="board"></div>
      </section>

      <section id="videoPanel" class="panel video-panel">
        <div class="panel-content">
          <div class="panel-header">
            <div class="panel-window-controls">
              <button
                id="minimizeVideoPanelBtn"
                class="panel-minimize"
                type="button"
                aria-label="Minimize call panel"
                title="Minimize call panel"
              >
                <span aria-hidden="true"></span>
              </button>
            </div>
            <h2>Call</h2>
          </div>
          <div class="panel-body video-panel-body">
            <div class="video-grid">
              <div class="video-card" id="localVideoCard">
                <p>You</p>
                <div class="video-box">
                  <div class="video-placeholder" aria-hidden="true">
                    <div class="video-avatar">Y</div>
                    <span>You</span>
                  </div>
                  <video id="localVideo" autoplay muted playsinline></video>
                </div>
              </div>
              <div class="video-card" id="remoteVideoCard">
                <p>Friend</p>
                <div class="video-box">
                  <div class="video-placeholder" aria-hidden="true">
                    <div class="video-avatar">F</div>
                    <span>Friend</span>
                  </div>
                  <video id="remoteVideo" autoplay playsinline></video>
                </div>
              </div>
            </div>
            <div class="call-toolbar" aria-label="Call controls">
              <div class="call-controls call-group" aria-label="Call controls">
                <button id="startVideoBtn" class="call-action is-positive call-action-image icon-video" type="button" aria-label="Start video call" title="Start video call">
                  <img src="icons/video-on.png" alt="" aria-hidden="true" class="call-icon-image" />
                </button>
                <button id="startMicBtn" class="call-action is-positive call-action-image icon-mic" type="button" aria-label="Turn microphone on" title="Turn microphone on">
                  <img src="icons/mic-on.png" alt="" aria-hidden="true" class="call-icon-image" />
                </button>
                <button id="startCameraBtn" class="call-action is-positive call-action-image icon-camera" type="button" aria-label="Turn camera on" title="Turn camera on">
                  <img src="icons/camera-on.png" alt="" aria-hidden="true" class="call-icon-image" />
                </button>
                <button id="startVoiceBtn" class="call-action is-positive call-action-image icon-phone" type="button" aria-label="Start voice call" title="Start voice call">
                  <img src="icons/phone-on.png" alt="" aria-hidden="true" class="call-icon-image" />
                </button>
              </div>
            </div>
          </div>
        </div>
        <audio id="remoteAudio" autoplay></audio>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
    <script src="app.js"></script>
  </body>
</html>
