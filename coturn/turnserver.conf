# Coturn configuration for Gomoku video calls
#
# Replace these placeholders before use:
# - YOUR_SERVER_PUBLIC_IP_OR_DOMAIN
# - YOUR_TURN_USERNAME
# - YOUR_TURN_PASSWORD
#
# Typical startup:
#   turnserver -c /path/to/turnserver.conf

listening-port=3478
tls-listening-port=5349

# If your server has a public IP, put it here. A DNS name also works.
realm=YOUR_SERVER_PUBLIC_IP_OR_DOMAIN
server-name=YOUR_SERVER_PUBLIC_IP_OR_DOMAIN

# Use long-term credentials so they map directly to your app's TURN env vars.
lt-cred-mech
user=YOUR_TURN_USERNAME:YOUR_TURN_PASSWORD

# NAT / public network settings.
external-ip=YOUR_SERVER_PUBLIC_IP_OR_DOMAIN

# Transport and relay settings.
fingerprint
no-multicast-peers
no-cli
min-port=49160
max-port=49200

# Logging
simple-log
log-file=stdout

# Recommended for production if you configure TLS certificates:
# cert=/etc/letsencrypt/live/YOUR_SERVER_PUBLIC_IP_OR_DOMAIN/fullchain.pem
# pkey=/etc/letsencrypt/live/YOUR_SERVER_PUBLIC_IP_OR_DOMAIN/privkey.pem
